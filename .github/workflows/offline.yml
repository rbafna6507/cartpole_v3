name: Offline SDK checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - run: uv sync --locked --extra sim
      - run: uv run --locked --extra sim pytest -q
      - run: uv run --locked python -m cartpole_sdk.control.native_build --source-root .
      - run: uv run --locked --extra sim python examples/controller_starter/run.py simulate --policy policies/working.json --seconds 5 --output runs/ci-actor
      - run: uv run --locked python examples/controller_starter/run.py replay --policy policies/working.json --recording runs/ci-actor/observations.jsonl --output runs/ci-replay.jsonl
